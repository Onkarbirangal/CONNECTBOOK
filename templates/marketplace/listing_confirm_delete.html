{% extends 'base.html' %}
{% load static %}

{% block title %}Delete Listing | ConnectBook{% endblock %}

{% block content %}
<div class="container py-5" style="max-width: 500px;">
    <div class="cb-card p-4 text-center">
        <i class="bi bi-trash3-fill text-danger fs-1 mb-2"></i>
        <h4 class="fw-bold">Delete Listing?</h4>
        <p class="text-muted small">Are you sure you want to remove '<strong>{{ listing.title }}</strong>' from the marketplace?</p>
        <form method="POST">
            {% csrf_token %}
            <div class="d-flex justify-content-center gap-2 mt-4">
                <a href="{% url 'marketplace:listing_detail' pk=listing.pk %}" class="btn btn-secondary px-4">Cancel</a>
                <button type="submit" class="btn btn-danger px-4">Delete Listing</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
