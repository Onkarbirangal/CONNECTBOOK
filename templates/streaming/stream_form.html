{% extends 'base.html' %}
{% load static %}

{% block title %}{{ title }} | ConnectBook Live{% endblock %}

{% block content %}
<div class="container py-4" style="max-width: 650px;">
    <div class="cb-card p-4">
        <h4 class="fw-bold mb-3"><i class="bi bi-broadcast text-danger me-2"></i>{{ title }}</h4>
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            
            <div class="mb-3">
                <label class="form-label fw-semibold">Broadcast Title *</label>
                {{ form.title }}
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Scheduled Start Time *</label>
                {{ form.scheduled_start }}
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Broadcast Thumbnail</label>
                {{ form.thumbnail }}
            </div>

            <div class="mb-4">
                <label class="form-label fw-semibold">Description</label>
                {{ form.description }}
            </div>

            <div class="d-flex justify-content-end gap-2">
                <a href="{% url 'streaming:stream_list' %}" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-danger px-4 fw-semibold">Schedule Broadcast</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
