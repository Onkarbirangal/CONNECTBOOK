{% extends 'base.html' %}
{% block title %}Reset Instructions Sent | ConnectBook{% endblock %}
{% block content %}
<div class="container d-flex align-items-center justify-content-center min-vh-100 py-4">
    <div class="cb-card p-4 text-center" style="max-width: 480px; width: 100%;">
        <i class="bi bi-envelope-check-fill text-success fs-1 mb-2"></i>
        <h4 class="fw-bold mb-2">Check Your Email</h4>
        <p class="text-muted small mb-4">If an account exists with {{ email }}, password reset instructions have been generated.</p>
        <a href="{% url 'accounts:login' %}" class="btn btn-cb-primary w-100">Back to Log In</a>
    </div>
</div>
{% endblock %}
