{% extends 'base.html' %}
{% load static %}

{% block title %}Password Reset Complete | ConnectBook{% endblock %}

{% block content %}
<div class="container d-flex align-items-center justify-content-center min-vh-100 py-3 py-md-5">
    <div class="cb-card shadow-lg p-4 p-md-5 text-center" style="max-width: 500px; width: 100%; border-radius: 12px;">
        <div class="mb-3">
            <span class="rounded-circle p-3 d-inline-block bg-success-subtle text-success fs-1">
                <i class="bi bi-check-circle-fill"></i>
            </span>
        </div>
        <h4 class="fw-bold mb-2">Password Reset Complete</h4>
        <p class="text-muted small mb-4">
            Your password has been set. You may go ahead and log in now with your new credentials.
        </p>

        <a href="{% url 'accounts:login' %}" class="btn btn-cb-primary w-100 py-2 fw-semibold fs-6">
            <i class="bi bi-box-arrow-in-right me-1"></i>Log In to ConnectBook
        </a>
    </div>
</div>
{% endblock %}
