{% extends 'base.html' %}
{% block title %}Find Your Account | ConnectBook{% endblock %}
{% block content %}
<div class="container d-flex align-items-center justify-content-center min-vh-100 py-4">
    <div class="cb-card p-4" style="max-width: 480px; width: 100%;">
        <h4 class="fw-bold mb-2">Find Your Account</h4>
        <p class="text-muted small mb-4">Please enter your email address to search for your account.</p>
        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <input type="email" name="email" class="form-control" placeholder="Email address" required>
            </div>
            <div class="d-flex justify-content-end gap-2">
                <a href="{% url 'accounts:login' %}" class="btn btn-cb-secondary">Cancel</a>
                <button type="submit" class="btn btn-cb-primary">Search</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
