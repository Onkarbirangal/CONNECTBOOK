<!-- ConnectBook Fullscreen Lightbox Modal -->
<div id="cbLightboxModal" class="cb-lightbox-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.94); z-index: 3000; align-items: center; justify-content: center; user-select: none;">
    <!-- Top Bar Controls -->
    <div class="position-absolute top-0 start-0 end-0 d-flex align-items-center justify-content-between p-3" style="z-index: 3010; background: linear-gradient(180deg, rgba(0,0,0,0.7) 0%, transparent 100%);">
        <span id="cbLightboxCounter" class="badge bg-dark bg-opacity-75 text-white px-3 py-2 rounded-pill fs-6 fw-normal">1 / 1</span>
        <div class="d-flex align-items-center gap-2">
            <a id="cbLightboxDownloadBtn" href="#" download class="btn btn-sm text-white" title="Download Image" target="_blank">
                <i class="bi bi-download fs-5"></i>
            </a>
            <button class="btn btn-sm text-white" onclick="closeLightbox()" title="Close (Esc)">
                <i class="bi bi-x-lg fs-4"></i>
            </button>
        </div>
    </div>

    <!-- Navigation Arrows -->
    <button id="cbLightboxPrevBtn" class="btn text-white position-absolute start-0 top-50 translate-middle-y ms-2 ms-md-4" style="z-index: 3010; background: rgba(255,255,255,0.15); border-radius: 50%; width: 48px; height: 48px; border: none;" onclick="prevLightboxImage()" aria-label="Previous image">
        <i class="bi bi-chevron-left fs-3"></i>
    </button>
    <button id="cbLightboxNextBtn" class="btn text-white position-absolute end-0 top-50 translate-middle-y me-2 me-md-4" style="z-index: 3010; background: rgba(255,255,255,0.15); border-radius: 50%; width: 48px; height: 48px; border: none;" onclick="nextLightboxImage()" aria-label="Next image">
        <i class="bi bi-chevron-right fs-3"></i>
    </button>

    <!-- Center Image Stage -->
    <div class="d-flex align-items-center justify-content-center w-100 h-100 p-2 p-md-4">
        <img id="cbLightboxImage" src="" alt="Fullscreen view" style="max-height: 85vh; max-width: 90vw; object-fit: contain; border-radius: 6px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); transition: opacity 0.2s ease;">
    </div>

    <!-- Bottom Caption Bar -->
    <div id="cbLightboxCaption" class="position-absolute bottom-0 start-0 end-0 text-white text-center p-3 small" style="z-index: 3010; background: linear-gradient(0deg, rgba(0,0,0,0.85) 0%, transparent 100%); min-height: 48px; display: none;"></div>
</div>
