<!-- ConnectBook Post Performance & Insights Modal -->
<div class="modal fade" id="cbPostInsightsModal" tabindex="-1" aria-labelledby="cbPostInsightsModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content border-0 shadow-lg" style="background: var(--cb-card); color: var(--cb-text);">
            <div class="modal-header border-bottom" style="border-color: var(--cb-border) !important;">
                <h5 class="modal-title fw-bold" id="cbPostInsightsModalLabel">
                    <i class="bi bi-bar-chart-line-fill text-primary me-2"></i>Post Insights & Performance
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-4" id="cbPostInsightsContent">
                <!-- Loading State -->
                <div class="text-center py-5" id="cbPostInsightsSpinner">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading insights...</span>
                    </div>
                    <div class="text-muted small mt-2">Aggregating post metrics...</div>
                </div>

                <!-- Insights Body (populated via JS) -->
                <div id="cbPostInsightsData" style="display: none;">
                    <!-- Overview Metrics Grid -->
                    <div class="row g-3 mb-4 text-center">
                        <div class="col-6 col-md-3">
                            <div class="p-3 rounded border" style="background: var(--cb-bg); border-color: var(--cb-border) !important;">
                                <div class="text-primary mb-1"><i class="bi bi-people-fill fs-3"></i></div>
                                <div class="fs-4 fw-bold" id="insightReach">0</div>
                                <div class="text-muted small" style="font-size: 12px;">Accounts Reached</div>
                            </div>
                        </div>
                        <div class="col-6 col-md-3">
                            <div class="p-3 rounded border" style="background: var(--cb-bg); border-color: var(--cb-border) !important;">
                                <div class="text-success mb-1"><i class="bi bi-eye-fill fs-3"></i></div>
                                <div class="fs-4 fw-bold" id="insightImpressions">0</div>
                                <div class="text-muted small" style="font-size: 12px;">Total Impressions</div>
                            </div>
                        </div>
                        <div class="col-6 col-md-3">
                            <div class="p-3 rounded border" style="background: var(--cb-bg); border-color: var(--cb-border) !important;">
                                <div class="text-warning mb-1"><i class="bi bi-activity fs-3"></i></div>
                                <div class="fs-4 fw-bold" id="insightEngagementRate">0%</div>
                                <div class="text-muted small" style="font-size: 12px;">Engagement Rate</div>
                            </div>
                        </div>
                        <div class="col-6 col-md-3">
                            <div class="p-3 rounded border" style="background: var(--cb-bg); border-color: var(--cb-border) !important;">
                                <div class="text-info mb-1"><i class="bi bi-hand-thumbs-up-fill fs-3"></i></div>
                                <div class="fs-4 fw-bold" id="insightTotalReactions">0</div>
                                <div class="text-muted small" style="font-size: 12px;">Total Reactions</div>
                            </div>
                        </div>
                    </div>

                    <!-- Reactions Breakdown Section -->
                    <div class="card mb-4 border" style="background: var(--cb-card); border-color: var(--cb-border) !important;">
                        <div class="card-header bg-transparent fw-bold small text-uppercase text-muted border-bottom" style="border-color: var(--cb-border) !important;">
                            Reactions Breakdown
                        </div>
                        <div class="card-body">
                            <div class="row text-center g-2" id="insightReactionsGrid">
                                <div class="col">
                                    <div class="fs-4">👍</div>
                                    <div class="fw-bold" id="reactionCountLike">0</div>
                                    <div class="text-muted" style="font-size: 11px;">Like</div>
                                </div>
                                <div class="col">
                                    <div class="fs-4">❤️</div>
                                    <div class="fw-bold" id="reactionCountLove">0</div>
                                    <div class="text-muted" style="font-size: 11px;">Love</div>
                                </div>
                                <div class="col">
                                    <div class="fs-4">🥰</div>
                                    <div class="fw-bold" id="reactionCountCare">0</div>
                                    <div class="text-muted" style="font-size: 11px;">Care</div>
                                </div>
                                <div class="col">
                                    <div class="fs-4">😆</div>
                                    <div class="fw-bold" id="reactionCountHaha">0</div>
                                    <div class="text-muted" style="font-size: 11px;">Haha</div>
                                </div>
                                <div class="col">
                                    <div class="fs-4">😮</div>
                                    <div class="fw-bold" id="reactionCountWow">0</div>
                                    <div class="text-muted" style="font-size: 11px;">Wow</div>
                                </div>
                                <div class="col">
                                    <div class="fs-4">😢</div>
                                    <div class="fw-bold" id="reactionCountSad">0</div>
                                    <div class="text-muted" style="font-size: 11px;">Sad</div>
                                </div>
                                <div class="col">
                                    <div class="fs-4">😡</div>
                                    <div class="fw-bold" id="reactionCountAngry">0</div>
                                    <div class="text-muted" style="font-size: 11px;">Angry</div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Additional Interactions Row -->
                    <div class="row g-3">
                        <div class="col-6">
                            <div class="d-flex align-items-center justify-content-between p-3 rounded border" style="background: var(--cb-bg); border-color: var(--cb-border) !important;">
                                <div class="d-flex align-items-center gap-2">
                                    <i class="bi bi-chat-text-fill text-primary fs-4"></i>
                                    <span class="fw-semibold">Comments</span>
                                </div>
                                <span class="badge bg-primary fs-6" id="insightComments">0</span>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="d-flex align-items-center justify-content-between p-3 rounded border" style="background: var(--cb-bg); border-color: var(--cb-border) !important;">
                                <div class="d-flex align-items-center gap-2">
                                    <i class="bi bi-share-fill text-secondary fs-4"></i>
                                    <span class="fw-semibold">Shares</span>
                                </div>
                                <span class="badge bg-secondary fs-6" id="insightShares">0</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer border-top" style="border-color: var(--cb-border) !important;">
                <button type="button" class="btn btn-secondary rounded-pill px-4" data-bs-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
</div>
