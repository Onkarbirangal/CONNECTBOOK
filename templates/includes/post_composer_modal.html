{% load static %}
<!-- Facebook-Inspired Advanced Post Composer Modal -->
<div class="modal fade" id="createPostModal" tabindex="-1" aria-labelledby="createPostModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg modal-fullscreen-sm-down">
        <div class="modal-content border-0 shadow-lg" style="background: var(--cb-card); color: var(--cb-text); border-radius: 12px; overflow: hidden;">
            
            <!-- Modal Header -->
            <div class="modal-header border-bottom py-2 px-3 position-relative">
                <h5 class="modal-title fw-bold w-100 text-center fs-5 mb-0" id="createPostModalLabel">Create Post</h5>
                <button type="button" class="btn-close position-absolute end-0 me-3" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            
            <form action="{% url 'social:create_post' %}" method="POST" enctype="multipart/form-data" id="postComposerForm">
                {% csrf_token %}
                <input type="hidden" name="post_type" id="composerPostType" value="text">
                <input type="hidden" name="background_style" id="composerBgStyle" value="none">
                <input type="hidden" name="feeling_category" id="composerFeelingCategory" value="">
                <input type="hidden" name="feeling_text" id="composerFeelingVal" value="">
                <input type="hidden" name="feeling_icon" id="composerFeelingIcon" value="">
                <input type="hidden" name="location_name" id="composerLocationName" value="">
                <input type="hidden" name="location_address" id="composerLocationAddress" value="">
                <input type="hidden" name="link_url" id="composerLinkUrl" value="">
                <input type="hidden" name="link_title" id="composerLinkTitle" value="">
                <input type="hidden" name="link_description" id="composerLinkDesc" value="">
                <input type="hidden" name="link_image" id="composerLinkImage" value="">
                <input type="hidden" name="next" id="composerNextUrl" value="{{ request.get_full_path }}">

                <div class="modal-body p-3" style="max-height: 75vh; overflow-y: auto;">
                    <!-- Author & Audience Header Line -->
                    <div class="d-flex align-items-center gap-2 mb-3">
                        <img src="{{ current_user_profile.get_avatar_url }}" class="cb-avatar rounded-circle" style="width: 44px; height: 44px; object-fit: cover;" alt="">
                        <div>
                            <div class="fw-bold d-flex flex-wrap align-items-center gap-1">
                                <span>{{ user.get_display_name }}</span>
                                
                                <!-- Dynamic Feeling Badge -->
                                <span class="badge bg-light text-dark border d-none align-items-center gap-1" id="badgeFeeling">
                                    <span id="badgeFeelingIcon"></span> <span id="badgeFeelingText"></span>
                                    <button type="button" class="btn-close p-0 ms-1" style="font-size: 8px;" onclick="removeComposerFeeling()"></button>
                                </span>

                                <!-- Dynamic Tagged Friends Badge -->
                                <span class="badge bg-light text-dark border d-none align-items-center gap-1" id="badgeTags">
                                    <i class="bi bi-people-fill text-primary me-1"></i><span id="badgeTagsText"></span>
                                    <button type="button" class="btn-close p-0 ms-1" style="font-size: 8px;" onclick="clearComposerTags()"></button>
                                </span>

                                <!-- Dynamic Location Badge -->
                                <span class="badge bg-light text-dark border d-none align-items-center gap-1" id="badgeLocation">
                                    <i class="bi bi-geo-alt-fill text-danger me-1"></i><span id="badgeLocationText"></span>
                                    <button type="button" class="btn-close p-0 ms-1" style="font-size: 8px;" onclick="removeComposerLocation()"></button>
                                </span>
                            </div>

                            <!-- Privacy Selector Pill -->
                            <div class="d-flex align-items-center gap-2 mt-1">
                                <select name="privacy" id="composerPrivacySelect" class="form-select form-select-sm py-0 px-2" style="width: auto; font-size: 12px; height: 26px; border-radius: 6px; background: var(--cb-bg); color: var(--cb-text);" onchange="handlePrivacyChange(this.value)">
                                    <option value="public">&#127760; Public</option>
                                    <option value="friends" selected>&#128101; Friends</option>
                                    <option value="friends_except">&#128683; Friends Except...</option>
                                    <option value="specific_friends">&#11088; Specific Friends...</option>
                                    <option value="only_me">&#128274; Only Me</option>
                                    <option value="custom">&#9881; Custom</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- Milestone Title Input (Shown when milestone post active) -->
                    <div id="sectionMilestone" class="mb-3 p-2 rounded border bg-light d-none">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <span class="fw-bold small text-primary"><i class="bi bi-star-fill text-warning me-1"></i>Life Event / Milestone Title</span>
                            <button type="button" class="btn-close" style="font-size: 10px;" onclick="toggleMilestoneSection(false)"></button>
                        </div>
                        <input type="text" name="milestone_title" id="composerMilestoneInput" class="form-control form-control-sm" placeholder="e.g. Started new position, Got engaged, Graduated...">
                    </div>

                    <!-- Main Text Area Container (Supports colored backgrounds) -->
                    <div class="position-relative mb-2 rounded-3 transition p-2" id="composerTextContainer" style="min-height: 120px;">
                        <textarea name="content" id="composerContentTextarea" class="form-control border-0 p-0 fs-5" rows="3" placeholder="What's on your mind, {{ user.first_name }}?" style="background: transparent; color: inherit; resize: none; box-shadow: none;" oninput="handleTextareaInput()"></textarea>
                    </div>

                    <!-- Background Theme Swatches Bar -->
                    <div class="d-flex align-items-center justify-content-between mb-3 px-1" id="composerBgBar">
                        <div class="d-flex align-items-center gap-2">
                            <!-- Toggle Swatches Strip -->
                            <button type="button" class="btn btn-sm btn-light border p-1 rounded-circle" id="btnToggleSwatches" onclick="toggleSwatchesStrip()" title="Choose Background Color" style="width: 32px; height: 32px;">
                                <i class="bi bi-palette-fill text-primary"></i>
                            </button>

                            <!-- Color Circles Strip -->
                            <div class="d-none align-items-center gap-1" id="swatchesStrip">
                                <button type="button" class="swatch-btn rounded-circle border-0" style="width: 24px; height: 24px; background: #e2e8f0;" onclick="selectBackground('none')" title="Default White"></button>
                                <button type="button" class="swatch-btn rounded-circle border-0" style="width: 24px; height: 24px; background: linear-gradient(135deg, #f97316 0%, #ec4899 100%);" onclick="selectBackground('grad_sunset')" title="Sunset"></button>
                                <button type="button" class="swatch-btn rounded-circle border-0" style="width: 24px; height: 24px; background: linear-gradient(135deg, #06b6d4 0%, #3b82f6 100%);" onclick="selectBackground('grad_ocean')" title="Ocean"></button>
                                <button type="button" class="swatch-btn rounded-circle border-0" style="width: 24px; height: 24px; background: linear-gradient(135deg, #ef4444 0%, #f59e0b 100%);" onclick="selectBackground('grad_fire')" title="Fire"></button>
                                <button type="button" class="swatch-btn rounded-circle border-0" style="width: 24px; height: 24px; background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%);" onclick="selectBackground('grad_purple')" title="Purple"></button>
                                <button type="button" class="swatch-btn rounded-circle border-0" style="width: 24px; height: 24px; background: linear-gradient(135deg, #10b981 0%, #06b6d4 100%);" onclick="selectBackground('grad_emerald')" title="Emerald"></button>
                                <button type="button" class="swatch-btn rounded-circle border-0" style="width: 24px; height: 24px; background: #0f172a;" onclick="selectBackground('solid_dark')" title="Dark Mode"></button>
                                <button type="button" class="swatch-btn rounded-circle border-0" style="width: 24px; height: 24px; background: linear-gradient(135deg, #e11d48 0%, #fb7185 100%);" onclick="selectBackground('grad_love')" title="Love"></button>
                            </div>
                        </div>

                        <!-- Emoji picker trigger -->
                        <button type="button" class="btn btn-sm text-muted p-1" onclick="insertEmoji('😊')" title="Insert Smile">
                            <i class="bi bi-emoji-smile fs-5"></i>
                        </button>
                    </div>

                    <!-- Multi-Image / Video Drop & Preview Gallery -->
                    <div id="composerMediaSection" class="p-3 rounded border mb-3 d-none position-relative" style="background: var(--cb-bg); border-style: dashed !important;">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <span class="fw-bold small text-success"><i class="bi bi-images me-1"></i>Selected Photos & Videos</span>
                            <button type="button" class="btn-close" style="font-size: 10px;" onclick="clearAllMedia()"></button>
                        </div>
                        <div id="mediaPreviewsGrid" class="row g-2 mb-2"></div>
                        <label class="btn btn-sm btn-outline-secondary w-100 py-2" style="cursor: pointer;">
                            <i class="bi bi-plus-circle me-1"></i>Add More Photos/Videos
                            <input type="file" id="postMediaExtraInput" multiple accept="image/*,video/*" class="d-none" onchange="handleExtraMediaFiles(this)">
                        </label>
                    </div>

                    <!-- Link Preview Card Container -->
                    <div id="sectionLinkPreview" class="p-2 rounded border mb-3 d-none position-relative" style="background: var(--cb-bg);">
                        <button type="button" class="btn-close position-absolute top-0 end-0 m-2" style="font-size: 10px; z-index: 5;" onclick="removeLinkPreview()"></button>
                        <div class="d-flex gap-3 align-items-center">
                            <img id="linkPreviewImg" src="" class="rounded" style="width: 100px; height: 75px; object-fit: cover; display: none;" alt="">
                            <div class="overflow-hidden">
                                <small class="text-uppercase text-muted fw-bold d-block" id="linkPreviewDomain" style="font-size: 10px;"></small>
                                <div class="fw-bold text-truncate" id="linkPreviewTitle"></div>
                                <small class="text-muted text-truncate d-block" id="linkPreviewDesc" style="font-size: 11px;"></small>
                            </div>
                        </div>
                    </div>

                    <!-- Sub-Drawer: Feeling & Activity -->
                    <div id="drawerFeeling" class="p-3 rounded border mb-3 d-none" style="background: var(--cb-bg);">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <span class="fw-bold small text-warning"><i class="bi bi-emoji-smile-fill me-1"></i>How are you feeling or what are you doing?</span>
                            <button type="button" class="btn-close" style="font-size: 10px;" onclick="toggleDrawer('drawerFeeling', false)"></button>
                        </div>
                        <input type="text" class="form-control form-control-sm mb-2" id="inputFeelingSearch" placeholder="Search feelings and activities..." oninput="filterFeelings(this.value)">
                        <div class="d-flex flex-wrap gap-1" id="feelingOptionsList" style="max-height: 140px; overflow-y: auto;">
                            <!-- Feelings -->
                            <button type="button" class="btn btn-sm btn-light border feeling-opt-btn" onclick="setFeeling('Feeling', 'happy', '😊')">😊 happy</button>
                            <button type="button" class="btn btn-sm btn-light border feeling-opt-btn" onclick="setFeeling('Feeling', 'blessed', '😇')">😇 blessed</button>
                            <button type="button" class="btn btn-sm btn-light border feeling-opt-btn" onclick="setFeeling('Feeling', 'loved', '🥰')">🥰 loved</button>
                            <button type="button" class="btn btn-sm btn-light border feeling-opt-btn" onclick="setFeeling('Feeling', 'excited', '🤩')">🤩 excited</button>
                            <button type="button" class="btn btn-sm btn-light border feeling-opt-btn" onclick="setFeeling('Feeling', 'grateful', '🙏')">🙏 grateful</button>
                            <button type="button" class="btn btn-sm btn-light border feeling-opt-btn" onclick="setFeeling('Feeling', 'proud', '😎')">😎 proud</button>
                            <button type="button" class="btn btn-sm btn-light border feeling-opt-btn" onclick="setFeeling('Feeling', 'tired', '😴')">😴 tired</button>
                            <button type="button" class="btn btn-sm btn-light border feeling-opt-btn" onclick="setFeeling('Feeling', 'sad', '😢')">😢 sad</button>
                            <!-- Activities -->
                            <button type="button" class="btn btn-sm btn-light border feeling-opt-btn" onclick="setFeeling('Celebrating', 'success', '🎉')">🎉 celebrating</button>
                            <button type="button" class="btn btn-sm btn-light border feeling-opt-btn" onclick="setFeeling('Watching', 'a movie', '🎬')">🎬 watching</button>
                            <button type="button" class="btn btn-sm btn-light border feeling-opt-btn" onclick="setFeeling('Eating', 'delicious food', '🍕')">🍕 eating</button>
                            <button type="button" class="btn btn-sm btn-light border feeling-opt-btn" onclick="setFeeling('Drinking', 'coffee', '☕')">☕ drinking</button>
                            <button type="button" class="btn btn-sm btn-light border feeling-opt-btn" onclick="setFeeling('Listening to', 'music', '🎧')">🎧 listening to</button>
                            <button type="button" class="btn btn-sm btn-light border feeling-opt-btn" onclick="setFeeling('Playing', 'video games', '🎮')">🎮 playing</button>
                            <button type="button" class="btn btn-sm btn-light border feeling-opt-btn" onclick="setFeeling('Traveling to', 'vacation', '✈️')">✈️ traveling to</button>
                            <button type="button" class="btn btn-sm btn-light border feeling-opt-btn" onclick="setFeeling('Working on', 'new projects', '💼')">💼 working</button>
                            <button type="button" class="btn btn-sm btn-light border feeling-opt-btn" onclick="setFeeling('Exercising at', 'the gym', '🏃')">🏃 exercising</button>
                        </div>
                    </div>

                    <!-- Sub-Drawer: Tag People -->
                    <div id="drawerTagPeople" class="p-3 rounded border mb-3 d-none" style="background: var(--cb-bg);">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <span class="fw-bold small text-primary"><i class="bi bi-tag-fill me-1"></i>Tag People in Post</span>
                            <button type="button" class="btn-close" style="font-size: 10px;" onclick="toggleDrawer('drawerTagPeople', false)"></button>
                        </div>
                        <input type="text" class="form-control form-control-sm mb-2" id="inputTagSearch" placeholder="Type a friend's name..." oninput="searchTagUsers(this.value)">
                        <div id="tagSearchResults" class="vstack gap-1 mb-2" style="max-height: 130px; overflow-y: auto;"></div>
                        <div id="selectedTagPills" class="d-flex flex-wrap gap-1"></div>
                    </div>

                    <!-- Sub-Drawer: Location / Check-In -->
                    <div id="drawerLocation" class="p-3 rounded border mb-3 d-none" style="background: var(--cb-bg);">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <span class="fw-bold small text-danger"><i class="bi bi-geo-alt-fill me-1"></i>Check in at a Location</span>
                            <button type="button" class="btn-close" style="font-size: 10px;" onclick="toggleDrawer('drawerLocation', false)"></button>
                        </div>
                        <input type="text" class="form-control form-control-sm mb-2" id="inputLocationSearch" placeholder="Where are you? (e.g. Central Park, New York)" onkeydown="if(event.key==='Enter'){event.preventDefault(); applyLocation(this.value);}">
                        <div class="d-flex flex-wrap gap-1">
                            <button type="button" class="btn btn-sm btn-light border" onclick="applyLocation('New York, NY')">📍 New York, NY</button>
                            <button type="button" class="btn btn-sm btn-light border" onclick="applyLocation('London, United Kingdom')">📍 London, UK</button>
                            <button type="button" class="btn btn-sm btn-light border" onclick="applyLocation('San Francisco, CA')">📍 San Francisco, CA</button>
                            <button type="button" class="btn btn-sm btn-light border" onclick="applyLocation('Tokyo, Japan')">📍 Tokyo, Japan</button>
                        </div>
                    </div>

                    <!-- Sub-Drawer: Poll Creator -->
                    <div id="postPollSection" class="p-3 rounded border mb-3 d-none" style="background: var(--cb-bg);">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <span class="fw-bold small text-info"><i class="bi bi-bar-chart-fill me-1"></i>Create Interactive Poll</span>
                            <button type="button" class="btn-close" style="font-size: 10px;" onclick="togglePollSection(false)"></button>
                        </div>
                        <input type="text" name="poll_question" id="pollQuestionInput" class="form-control form-control-sm mb-2" placeholder="Ask a question...">
                        <div class="vstack gap-2 mb-2">
                            <input type="text" name="poll_option_1" class="form-control form-control-sm" placeholder="Option 1">
                            <input type="text" name="poll_option_2" class="form-control form-control-sm" placeholder="Option 2">
                            <input type="text" name="poll_option_3" class="form-control form-control-sm" placeholder="Option 3 (optional)">
                            <input type="text" name="poll_option_4" class="form-control form-control-sm" placeholder="Option 4 (optional)">
                        </div>
                        <div class="d-flex align-items-center gap-2">
                            <label class="small text-muted mb-0">Poll Duration:</label>
                            <select name="poll_expiration_days" class="form-select form-select-sm" style="width: auto;">
                                <option value="1">1 Day</option>
                                <option value="3">3 Days</option>
                                <option value="7" selected>1 Week</option>
                                <option value="14">2 Weeks</option>
                                <option value="0">Never expires</option>
                            </select>
                        </div>
                    </div>

                    <!-- Custom Audience Selector Drawer -->
                    <div id="drawerAudienceSelector" class="p-3 rounded border mb-3 d-none bg-light">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <span class="fw-bold small text-secondary" id="audienceDrawerTitle">Audience Settings</span>
                            <button type="button" class="btn-close" style="font-size: 10px;" onclick="toggleDrawer('drawerAudienceSelector', false)"></button>
                        </div>
                        <input type="text" class="form-control form-control-sm mb-2" id="inputAudienceSearch" placeholder="Search friends..." oninput="searchAudienceUsers(this.value)">
                        <div id="audienceSearchResults" class="vstack gap-1" style="max-height: 120px; overflow-y: auto;"></div>
                        <div id="selectedAudiencePills" class="d-flex flex-wrap gap-1 mt-2"></div>
                    </div>

                    <!-- "Add to your post" Floating Facebook Toolbar -->
                    <div class="p-2 p-md-3 rounded-3 border d-flex align-items-center justify-content-between mb-3 shadow-sm" style="background: var(--cb-card);">
                        <span class="small fw-bold">Add to your post</span>
                        <div class="d-flex align-items-center gap-1">
                            <!-- Photo/Video -->
                            <label class="btn btn-sm btn-light border-0 rounded-circle text-success fs-5 p-2 mb-0" style="width: 38px; height: 38px; display: flex; align-items: center; justify-content: center;" title="Photo / Video">
                                <i class="bi bi-images"></i>
                                <input type="file" name="media" id="postMediaInput" multiple accept="image/*,video/*" class="d-none" onchange="handleMediaFiles(this)">
                            </label>

                            <!-- Tag People -->
                            <button type="button" class="btn btn-sm btn-light border-0 rounded-circle text-primary fs-5 p-2" style="width: 38px; height: 38px; display: flex; align-items: center; justify-content: center;" onclick="toggleDrawer('drawerTagPeople')" title="Tag People">
                                <i class="bi bi-person-tag"></i>
                            </button>

                            <!-- Feeling / Activity -->
                            <button type="button" class="btn btn-sm btn-light border-0 rounded-circle text-warning fs-5 p-2" style="width: 38px; height: 38px; display: flex; align-items: center; justify-content: center;" onclick="toggleDrawer('drawerFeeling')" title="Feeling / Activity">
                                <i class="bi bi-emoji-smile"></i>
                            </button>

                            <!-- Location Check In -->
                            <button type="button" class="btn btn-sm btn-light border-0 rounded-circle text-danger fs-5 p-2" style="width: 38px; height: 38px; display: flex; align-items: center; justify-content: center;" onclick="toggleDrawer('drawerLocation')" title="Check In">
                                <i class="bi bi-geo-alt"></i>
                            </button>

                            <!-- Poll -->
                            <button type="button" class="btn btn-sm btn-light border-0 rounded-circle text-info fs-5 p-2" style="width: 38px; height: 38px; display: flex; align-items: center; justify-content: center;" onclick="togglePollSection()" title="Poll">
                                <i class="bi bi-bar-chart"></i>
                            </button>

                            <!-- Milestone / Life Event -->
                            <button type="button" class="btn btn-sm btn-light border-0 rounded-circle text-purple fs-5 p-2" style="width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; color: #8b5cf6;" onclick="toggleMilestoneSection()" title="Milestone / Life Event">
                                <i class="bi bi-star"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Publishing Options & Controls Accordion -->
                    <div class="rounded-3 p-3 border mb-2 small" style="background: var(--cb-bg);">
                        <div class="row g-2 align-items-center mb-2">
                            <div class="col-sm-6">
                                <label class="form-label fw-bold mb-1" style="font-size: 11px;">Publishing Schedule</label>
                                <select name="status" id="postStatusSelect" class="form-select form-select-sm" onchange="handleStatusChange(this.value)">
                                    <option value="published">Publish Now</option>
                                    <option value="draft">Save as Draft</option>
                                    <option value="scheduled">Schedule Post</option>
                                </select>
                            </div>
                            <div class="col-sm-6 d-none" id="scheduleTimeGroup">
                                <label class="form-label fw-bold mb-1" style="font-size: 11px;">Schedule Time</label>
                                <input type="datetime-local" name="scheduled_at" id="inputScheduledAt" class="form-control form-control-sm">
                            </div>
                        </div>

                        <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 pt-2 border-top">
                            <div class="form-check form-switch mb-0">
                                <input class="form-check-input" type="checkbox" name="comments_enabled" id="commentsEnabledCheck" checked>
                                <label class="form-check-label text-muted" for="commentsEnabledCheck">Allow comments</label>
                            </div>
                            <div class="form-check form-switch mb-0">
                                <input class="form-check-input" type="checkbox" name="allow_sharing" id="allowSharingCheck" checked>
                                <label class="form-check-label text-muted" for="allowSharingCheck">Allow sharing</label>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Footer with Post Button -->
                <div class="modal-footer border-0 p-3 pt-0">
                    <button type="submit" class="btn btn-cb-primary w-100 py-2 fs-6 fw-bold shadow-sm" id="btnSubmitPost">
                        Post
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

    font-size: 24px !important;
    min-height: 200px !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
}
.cb-bg-grad_love {
    background: linear-gradient(135deg, #e11d48 0%, #fb7185 100%) !important;
    color: white !important;
    text-align: center !important;
    font-weight: bold !important;
    font-size: 24px !important;
    min-height: 200px !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
}
</style>

<script>
(function() {
    let taggedUsersMap = new Map();
    let audienceAllowMap = new Map();
    let audienceDenyMap = new Map();
    let mediaFilesList = [];

    // Background Themes
    window.toggleSwatchesStrip = function() {
        const strip = document.getElementById('swatchesStrip');
        if (strip) strip.classList.toggle('d-none');
    };

    window.selectBackground = function(bgKey) {
        const bgInput = document.getElementById('composerBgStyle');
        const container = document.getElementById('composerTextContainer');
        const textarea = document.getElementById('composerContentTextarea');
        if (!bgInput || !container || !textarea) return;

        bgInput.value = bgKey;

        // Reset previous classes
        container.className = 'position-relative mb-2 rounded-3 transition p-2';
        if (bgKey !== 'none') {
            container.classList.add('cb-bg-' + bgKey);
            textarea.style.color = '#ffffff';
            textarea.style.textAlign = 'center';
            textarea.style.fontSize = '24px';
        } else {
            textarea.style.color = '';
            textarea.style.textAlign = '';
            textarea.style.fontSize = '';
        }
    };

    window.insertEmoji = function(emoji) {
        const txt = document.getElementById('composerContentTextarea');
        if (txt) {
            txt.value += emoji;
            txt.focus();
        }
    };

    // Link URL detection inside textarea
    window.handleTextareaInput = function() {
        const txt = document.getElementById('composerContentTextarea');
        if (!txt) return;
        const val = txt.value;
        const urlMatch = val.match(/(https?:\/\/[^\s]+)/g);
        if (urlMatch && urlMatch.length > 0) {
            const detectedUrl = urlMatch[0];
            const currentLink = document.getElementById('composerLinkUrl').value;
            if (currentLink !== detectedUrl) {
                fetchLinkMetadata(detectedUrl);
            }
        }
    };

    function fetchLinkMetadata(url) {
        fetch('{% url "social:link_preview" %}', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded',
                'X-CSRFToken': '{{ csrf_token }}',
                'X-Requested-With': 'XMLHttpRequest'
            },
            body: new URLSearchParams({ url: url })
        })
        .then(r => r.json())
        .then(data => {
            if (data.status === 'ok') {
                document.getElementById('composerLinkUrl').value = data.url;
                document.getElementById('composerLinkTitle').value = data.title;
                document.getElementById('composerLinkDesc').value = data.description;
                document.getElementById('composerLinkImage').value = data.image;

                document.getElementById('linkPreviewDomain').textContent = data.domain;
                document.getElementById('linkPreviewTitle').textContent = data.title;
                document.getElementById('linkPreviewDesc').textContent = data.description;
                const img = document.getElementById('linkPreviewImg');
                if (data.image) {
                    img.src = data.image;
                    img.style.display = 'block';
                } else {
                    img.style.display = 'none';
                }
                document.getElementById('sectionLinkPreview').classList.remove('d-none');
            }
        })
        .catch(e => console.error("Link preview error:", e));
    }

    window.removeLinkPreview = function() {
        document.getElementById('composerLinkUrl').value = '';
        document.getElementById('composerLinkTitle').value = '';
        document.getElementById('composerLinkDesc').value = '';
        document.getElementById('composerLinkImage').value = '';
        document.getElementById('sectionLinkPreview').classList.add('d-none');
    };

    // Drawers Toggling
    window.toggleDrawer = function(drawerId, forceState) {
        const d = document.getElementById(drawerId);
        if (!d) return;
        if (typeof forceState === 'boolean') {
            d.classList.toggle('d-none', !forceState);
        } else {
            d.classList.toggle('d-none');
        }
    };

    // Feelings & Activity
    window.setFeeling = function(category, text, icon) {
        document.getElementById('composerFeelingCategory').value = category;
        document.getElementById('composerFeelingVal').value = text;
        document.getElementById('composerFeelingIcon').value = icon;

        document.getElementById('badgeFeelingIcon').textContent = icon;
        document.getElementById('badgeFeelingText').textContent = `${category.toLowerCase()} ${text}`;
        document.getElementById('badgeFeeling').classList.remove('d-none');
        document.getElementById('badgeFeeling').classList.add('d-inline-flex');
        toggleDrawer('drawerFeeling', false);
    };

    window.removeComposerFeeling = function() {
        document.getElementById('composerFeelingCategory').value = '';
        document.getElementById('composerFeelingVal').value = '';
        document.getElementById('composerFeelingIcon').value = '';
        document.getElementById('badgeFeeling').classList.add('d-none');
    };

    window.filterFeelings = function(q) {
        const query = q.toLowerCase();
        document.querySelectorAll('.feeling-opt-btn').forEach(btn => {
            btn.style.display = btn.textContent.toLowerCase().includes(query) ? 'inline-block' : 'none';
        });
    };

    // Location / Check-In
    window.applyLocation = function(locName) {
        if (!locName.trim()) return;
        document.getElementById('composerLocationName').value = locName;
        document.getElementById('badgeLocationText').textContent = locName;
        document.getElementById('badgeLocation').classList.remove('d-none');
        document.getElementById('badgeLocation').classList.add('d-inline-flex');
        toggleDrawer('drawerLocation', false);
    };

    window.removeComposerLocation = function() {
        document.getElementById('composerLocationName').value = '';
        document.getElementById('badgeLocation').classList.add('d-none');
    };

    // Tag People Search & Management
    window.searchTagUsers = function(query) {
        const resultsBox = document.getElementById('tagSearchResults');
        if (!query.trim()) {
            resultsBox.innerHTML = '';
            return;
        }
        fetch('{% url "social:tag_search" %}?q=' + encodeURIComponent(query))
        .then(r => r.json())
        .then(data => {
            resultsBox.innerHTML = '';
            (data.users || []).forEach(u => {
                const row = document.createElement('div');
                row.className = 'd-flex align-items-center justify-content-between p-1 rounded hover-bg cursor-pointer';
                row.innerHTML = `
                    <div class="d-flex align-items-center gap-2">
                        <img src="${u.avatar}" class="rounded-circle" style="width: 26px; height: 26px; object-fit: cover;">
                        <span class="small fw-semibold">${u.display_name} (@${u.username})</span>
                    </div>
                    <button type="button" class="btn btn-sm btn-outline-primary py-0 px-2" style="font-size: 11px;">Tag</button>
                `;
                row.onclick = () => addTagUser(u);
                resultsBox.appendChild(row);
            });
        });
    };

    function addTagUser(user) {
        taggedUsersMap.set(user.id, user);
        renderTaggedBadges();
    }

    window.removeTagUser = function(userId) {
        taggedUsersMap.delete(userId);
        renderTaggedBadges();
    };

    window.clearComposerTags = function() {
        taggedUsersMap.clear();
        renderTaggedBadges();
    };

    function renderTaggedBadges() {
        const pillsBox = document.getElementById('selectedTagPills');
        const badgeTags = document.getElementById('badgeTags');
        const badgeTagsText = document.getElementById('badgeTagsText');
        pillsBox.innerHTML = '';

        // Clean hidden inputs
        document.querySelectorAll('input[name="tagged_user_ids[]"]').forEach(el => el.remove());

        if (taggedUsersMap.size === 0) {
            badgeTags.classList.add('d-none');
            return;
        }

        const form = document.getElementById('postComposerForm');
        let names = [];
        taggedUsersMap.forEach(u => {
            names.push(u.display_name);

            // Add hidden input
            const input = document.createElement('input');
            input.type = 'hidden';
            input.name = 'tagged_user_ids[]';
            input.value = u.id;
            form.appendChild(input);

            // Add removable pill in drawer
            const pill = document.createElement('span');
            pill.className = 'badge bg-primary d-inline-flex align-items-center gap-1';
            pill.innerHTML = `${u.display_name} <i class="bi bi-x cursor-pointer" onclick="removeTagUser(${u.id})"></i>`;
            pillsBox.appendChild(pill);
        });

        badgeTagsText.textContent = names.length === 1 ? names[0] : `${names[0]} and ${names.length - 1} other${names.length > 2 ? 's' : ''}`;
        badgeTags.classList.remove('d-none');
        badgeTags.classList.add('d-inline-flex');
    }

    // Milestone Section
    window.toggleMilestoneSection = function(force) {
        const sec = document.getElementById('sectionMilestone');
        if (typeof force === 'boolean') {
            sec.classList.toggle('d-none', !force);
        } else {
            sec.classList.toggle('d-none');
        }
        if (!sec.classList.contains('d-none')) {
            document.getElementById('composerPostType').value = 'milestone';
            document.getElementById('composerMilestoneInput').focus();
        } else {
            document.getElementById('composerMilestoneInput').value = '';
        }
    };

    // Poll Section
    window.togglePollSection = function(force) {
        const sec = document.getElementById('postPollSection');
        if (typeof force === 'boolean') {
            sec.classList.toggle('d-none', !force);
        } else {
            sec.classList.toggle('d-none');
        }
        if (!sec.classList.contains('d-none')) {
            document.getElementById('composerPostType').value = 'poll';
            document.getElementById('pollQuestionInput').focus();
        }
    };

    // Audience selection handler
    window.handlePrivacyChange = function(val) {
        if (val === 'friends_except' || val === 'specific_friends' || val === 'custom') {
            document.getElementById('audienceDrawerTitle').textContent = val === 'friends_except' ? 'Hide From (Friends Except...)' : 'Visible To (Specific Friends...)';
            toggleDrawer('drawerAudienceSelector', true);
        } else {
            toggleDrawer('drawerAudienceSelector', false);
        }
    };

    // Helper to synchronize mediaFilesList back to postMediaInput.files using DataTransfer
    function syncMediaInput() {
        const input = document.getElementById('postMediaInput');
        if (!input) return;
        try {
            const dt = new DataTransfer();
            mediaFilesList.forEach(file => dt.items.add(file));
            input.files = dt.files;
        } catch (e) {
            console.warn('DataTransfer not supported or error syncing files:', e);
        }

        // Update post_type based on media files
        const typeInput = document.getElementById('composerPostType');
        if (mediaFilesList.length > 0) {
            const hasVideo = mediaFilesList.some(f => f.type.startsWith('video'));
            typeInput.value = hasVideo ? 'video' : 'photo';
        } else {
            const milestone = document.getElementById('composerMilestoneInput')?.value;
            const poll = document.getElementById('pollQuestionInput')?.value;
            const link = document.getElementById('composerLinkUrl')?.value;
            if (milestone) typeInput.value = 'milestone';
            else if (poll) typeInput.value = 'poll';
            else if (link) typeInput.value = 'link';
            else typeInput.value = 'text';
        }
    }

    // Media Files Preview & Reorder
    window.handleMediaFiles = function(input) {
        if (input.files && input.files.length > 0) {
            mediaFilesList = Array.from(input.files);
            syncMediaInput();
            renderMediaPreviews();
        }
    };

    window.handleExtraMediaFiles = function(input) {
        if (input.files && input.files.length > 0) {
            mediaFilesList = mediaFilesList.concat(Array.from(input.files));
            syncMediaInput();
            renderMediaPreviews();
        }
    };

    window.clearAllMedia = function() {
        mediaFilesList = [];
        const input = document.getElementById('postMediaInput');
        if (input) input.value = '';
        const extra = document.getElementById('postMediaExtraInput');
        if (extra) extra.value = '';
        syncMediaInput();
        renderMediaPreviews();
    };

    function renderMediaPreviews() {
        const grid = document.getElementById('mediaPreviewsGrid');
        const container = document.getElementById('composerMediaSection');
        grid.innerHTML = '';

        if (mediaFilesList.length === 0) {
            container.classList.add('d-none');
            return;
        }

        container.classList.remove('d-none');
        // When photos are attached, disable background style
        selectBackground('none');

        mediaFilesList.forEach((file, idx) => {
            const col = document.createElement('div');
            col.className = 'col-6 col-md-4 position-relative';
            const isVideo = file.type.startsWith('video');

            const card = document.createElement('div');
            card.className = 'card h-100 overflow-hidden border shadow-sm p-1';

            let mediaElem = isVideo
                ? `<video src="${URL.createObjectURL(file)}" class="w-100 rounded" style="height: 110px; object-fit: cover;"></video>`
                : `<img src="${URL.createObjectURL(file)}" class="w-100 rounded" style="height: 110px; object-fit: cover;">`;

            card.innerHTML = `
                <div class="position-relative">
                    ${mediaElem}
                    <button type="button" class="btn-close position-absolute top-0 end-0 m-1 bg-white p-1 rounded-circle shadow-sm" style="font-size: 8px;" onclick="removeMediaItem(${idx})"></button>
                </div>
                <div class="mt-1">
                    <input type="text" name="media_captions[]" class="form-control form-control-sm py-0" style="font-size: 11px;" placeholder="Add caption...">
                    <input type="text" name="media_alt_text[]" class="form-control form-control-sm py-0 mt-1" style="font-size: 11px;" placeholder="Alt text...">
                </div>
            `;
            col.appendChild(card);
            grid.appendChild(col);
        });
    }

    window.removeMediaItem = function(index) {
        mediaFilesList.splice(index, 1);
        syncMediaInput();
        renderMediaPreviews();
    };

    // Drag-and-drop file upload support on text container & media section
    const dropZones = [document.getElementById('composerTextContainer'), document.getElementById('composerMediaSection')];
    dropZones.forEach(zone => {
        if (!zone) return;
        ['dragenter', 'dragover'].forEach(eventName => {
            zone.addEventListener(eventName, (e) => {
                e.preventDefault();
                e.stopPropagation();
                zone.classList.add('border-primary', 'bg-light');
            }, false);
        });
        ['dragleave', 'drop'].forEach(eventName => {
            zone.addEventListener(eventName, (e) => {
                e.preventDefault();
                e.stopPropagation();
                zone.classList.remove('border-primary', 'bg-light');
            }, false);
        });
        zone.addEventListener('drop', (e) => {
            const dt = e.dataTransfer;
            if (dt && dt.files && dt.files.length > 0) {
                const validFiles = Array.from(dt.files).filter(f => f.type.startsWith('image/') || f.type.startsWith('video/'));
                if (validFiles.length > 0) {
                    mediaFilesList = mediaFilesList.concat(validFiles);
                    syncMediaInput();
                    renderMediaPreviews();
                }
            }
        }, false);
    });

    // Client-side submission validation & loading feedback
    const composerForm = document.getElementById('postComposerForm');
    if (composerForm) {
        composerForm.addEventListener('submit', function(e) {
            const content = (document.getElementById('composerContentTextarea')?.value || '').trim();
            const pollQ = (document.getElementById('pollQuestionInput')?.value || '').trim();
            const linkU = (document.getElementById('composerLinkUrl')?.value || '').trim();
            const milestoneT = (document.getElementById('composerMilestoneInput')?.value || '').trim();

            if (!content && mediaFilesList.length === 0 && !pollQ && !linkU && !milestoneT) {
                e.preventDefault();
                alert('Please enter some text or attach a photo/video before posting.');
                return false;
            }

            // Sync media files right before submit
            syncMediaInput();

            // Visual loading state
            const submitBtn = document.getElementById('btnSubmitPost');
            if (submitBtn) {
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>Publishing...';
            }
        });
    }

    // Status change
    window.handleStatusChange = function(status) {
        const timeGrp = document.getElementById('scheduleTimeGroup');
        const btn = document.getElementById('btnSubmitPost');
        if (status === 'scheduled') {
            timeGrp.classList.remove('d-none');
            btn.textContent = 'Schedule Post';
        } else if (status === 'draft') {
            timeGrp.classList.add('d-none');
            btn.textContent = 'Save Draft';
        } else {
            timeGrp.classList.add('d-none');
            btn.textContent = 'Post';
        }
    };

})();
</script>
