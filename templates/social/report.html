{% extends 'base.html' %}
{% block title %}Report Content | ConnectBook{% endblock %}
{% block content %}
<div class="container py-4" style="max-width: 550px;">
    <div class="cb-card p-4">
        <h4 class="fw-bold text-danger mb-2"><i class="bi bi-flag-fill me-2"></i>Report Content</h4>
        <p class="text-muted small mb-4">Please tell us why you are reporting this {{ target_type }}. We won't let the person know who reported them.</p>

        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label fw-bold">Select a Reason</label>
                <select name="reason" class="form-select" required>
                    <option value="spam">Spam or Scam</option>
                    <option value="harassment">Harassment or Bullying</option>
                    <option value="hate_speech">Hate Speech</option>
                    <option value="violence">Violence or Physical Harm</option>
                    <option value="nudity">Nudity or Sexual Activity</option>
                    <option value="false_info">False Information</option>
                    <option value="other">Other Violation</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Additional Details (Optional)</label>
                <textarea name="details" class="form-control" rows="3" placeholder="Provide any additional context for our moderation team..."></textarea>
            </div>

            <div class="d-flex justify-content-end gap-2">
                <a href="{% url 'social:feed' %}" class="btn btn-cb-secondary">Cancel</a>
                <button type="submit" class="btn btn-danger">Submit Report</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
