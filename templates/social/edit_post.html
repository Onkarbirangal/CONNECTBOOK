{% extends 'base.html' %}
{% block title %}Edit Post | ConnectBook{% endblock %}
{% block content %}
<div class="container py-4" style="max-width: 600px;">
    <div class="cb-card p-4">
        <h4 class="fw-bold mb-3">Edit Post</h4>
        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <textarea name="content" class="form-control" rows="5" required>{{ post.content }}</textarea>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">Audience</label>
                <select name="privacy" class="form-select">
                    <option value="public" {% if post.privacy == 'public' %}selected{% endif %}>Public</option>
                    <option value="friends" {% if post.privacy == 'friends' %}selected{% endif %}>Friends Only</option>
                    <option value="only_me" {% if post.privacy == 'only_me' %}selected{% endif %}>Only Me</option>
                </select>
            </div>
            <div class="d-flex justify-content-end gap-2">
                <a href="{% url 'social:feed' %}" class="btn btn-cb-secondary">Cancel</a>
                <button type="submit" class="btn btn-cb-primary">Save Changes</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
