{% extends 'base.html' %}
{% load static %}

{% block title %}{{ title }} | ConnectBook{% endblock %}

{% block content %}
<div class="container py-4" style="max-width: 600px;">
    <div class="cb-card p-4 shadow-sm border" style="border-radius: 12px; background: var(--cb-card);">
        <div class="d-flex align-items-center justify-content-between pb-3 border-bottom mb-4" style="border-color: var(--cb-border) !important;">
            <h4 class="fw-bold mb-0"><i class="bi bi-images text-primary me-2"></i>{{ title }}</h4>
            <a href="{% url 'accounts:profile' username=user.username %}?tab=photos&subtab=albums" class="btn btn-sm btn-outline-secondary rounded-pill">Cancel</a>
        </div>

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label fw-bold">Album Title <span class="text-danger">*</span></label>
                <input type="text" name="title" class="form-control" value="{{ album.title|default:'' }}" placeholder="e.g. Summer Vacation, Birthday Bash, Photography" required>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Description (Optional)</label>
                <textarea name="description" rows="3" class="form-control" placeholder="Tell friends about this album...">{{ album.description|default:'' }}</textarea>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Audience & Privacy</label>
                <select name="privacy" class="form-select">
                    <option value="public" {% if album.privacy == 'public' %}selected{% endif %}>Public – Visible to anyone</option>
                    <option value="friends" {% if album.privacy == 'friends' or not album %}selected{% endif %}>Friends Only – Visible to friends</option>
                    <option value="only_me" {% if album.privacy == 'only_me' %}selected{% endif %}>Only Me – Private to you</option>
                </select>
            </div>

            <div class="mb-4">
                <label class="form-label fw-bold">Cover Photo (Optional)</label>
                {% if album.cover_photo %}
                    <div class="mb-2">
                        <img src="{{ album.cover_photo.url }}" class="rounded shadow-sm" style="height: 100px; object-fit: cover;" alt="">
                    </div>
                {% endif %}
                <input type="file" name="cover_photo" accept="image/*" class="form-control">
            </div>

            <button type="submit" class="btn btn-cb-primary w-100 py-2 fw-semibold rounded-pill shadow-sm">
                <i class="bi bi-check-lg me-1"></i> Save Album
            </button>
        </form>
    </div>
</div>
{% endblock %}
