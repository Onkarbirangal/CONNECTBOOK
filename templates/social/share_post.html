{% extends 'base.html' %}
{% block title %}Share Post | ConnectBook{% endblock %}
{% block content %}
<div class="container py-4" style="max-width: 600px;">
    <div class="cb-card p-4">
        <h4 class="fw-bold mb-3">Share to Your Feed</h4>
        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <textarea name="content" class="form-control" rows="3" placeholder="Say something about this..."></textarea>
            </div>
            <div class="p-3 rounded border mb-3" style="background: var(--cb-bg);">
                <div class="d-flex align-items-center gap-2 mb-2">
                    <img src="{{ original_post.author.profile.get_avatar_url }}" class="cb-avatar cb-avatar-sm" alt="">
                    <div>
                        <div class="fw-bold small">{{ original_post.author.get_display_name }}</div>
                        <div class="text-muted" style="font-size: 11px;">{{ original_post.created_at|timesince }} ago</div>
                    </div>
                </div>
                <div class="small">{{ original_post.content }}</div>
            </div>
            <div class="d-flex justify-content-end gap-2">
                <a href="{% url 'social:feed' %}" class="btn btn-cb-secondary">Cancel</a>
                <button type="submit" class="btn btn-cb-primary">Share Now</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
