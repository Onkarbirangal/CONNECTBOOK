{% extends 'base.html' %}
{% load static %}

{% block title %}Delete Event | ConnectBook{% endblock %}

{% block content %}
<div class="container py-5" style="max-width: 500px;">
    <div class="cb-card p-4 text-center">
        <i class="bi bi-calendar-x-fill text-danger fs-1 mb-2"></i>
        <h4 class="fw-bold">Delete {{ event.title }}?</h4>
        <p class="text-muted small">Are you sure you want to cancel and delete this event? All guest RSVPs will be removed.</p>
        <form method="POST">
            {% csrf_token %}
            <div class="d-flex justify-content-center gap-2 mt-4">
                <a href="{% url 'events_app:event_detail' pk=event.pk %}" class="btn btn-secondary px-4">Keep Event</a>
                <button type="submit" class="btn btn-danger px-4">Delete Event</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
